<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>바둑 문제 목록 생성기 (무작위 섞기)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 30px; background-color: #f4f7f6; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        textarea { width: 100%; height: 80px; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; resize: none; }
        .btn-group { display: flex; gap: 5px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn-main { background-color: #007bff; color: white; }
        .btn-main:hover { background-color: #0056b3; }
        .btn-copy { background-color: #6c757d; color: white; }
        .btn-copy:hover { background-color: #5a6268; }
        
        #linkList { margin-top: 20px; }
        .problem-item { display: flex; align-items: center; margin-bottom: 8px; animation: fadeIn 0.3s ease; }
        .problem-index { width: 35px; font-weight: bold; color: #666; font-size: 14px; }
        .problem-link { flex-grow: 1; padding: 10px; background: #f8f9fa; color: #007bff; text-decoration: none; border: 1px solid #dee2e6; border-radius: 4px; text-align: center; transition: 0.3s; }
        .problem-link:hover { background: #e2e6ea; border-color: #adb5bd; }

        .problem-link.active {
            background-color: #e9ecef;
            color: #adb5bd;
            border-color: #dee2e6;
            text-decoration: line-through;
        }
        
        .hint { font-size: 13px; color: #666; margin-top: 15px; text-align: center; line-height: 1.6; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h2> 101weiqi : 수근대사전 오답노트 </h2>
    <textarea id="nums" placeholder="번호 입력 (예: 330 385 392)"></textarea>
    
    <div class="btn-group">
        <button class="btn-main" onclick="generateAndGo()">무작위 목록 생성</button>
        <button class="btn-copy" onclick="copyCurrentUrl()">URL 복사</button>
    </div>
    <p class="hint">스페이스바나 엔터로 구분해서 입력하세요.<br>'무작위 목록 생성'을 누를 때마다 순서가 바뀝니다.</p>
    
    <div id="linkList"></div>
</div>

<script>
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const numsParam = urlParams.get('nums');
        if (numsParam) {
            document.getElementById('nums').value = numsParam.split(',').join(' ');
            processProblems(numsParam);
        }
    };

    // ✅ 배열을 무작위로 섞는 함수 (Fisher-Yates 알고리즘)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateAndGo() {
        const inputVal = document.getElementById('nums').value.trim();
        if (!inputVal) {
            alert("번호를 입력해 주세요.");
            return;
        }

        let numbersArray = inputVal.split(/[\s,]+/).filter(n => n.length > 0);
        
        // ✅ 목록을 생성하기 전에 무작위로 섞습니다.
        numbersArray = shuffleArray(numbersArray);
        
        const formattedNums = numbersArray.join(',');
        
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?nums=' + formattedNums;
        window.history.pushState({ path: newUrl }, '', newUrl);

        processProblems(formattedNums);
    }

    function processProblems(numbersString) {
        const linkListDiv = document.getElementById('linkList');
        const baseUrl = "https://www.101weiqi.com/book/levelorder/469/";
        const numbers = numbersString.split(',');

        linkListDiv.innerHTML = ""; 

        numbers.forEach((num, index) => {
            if (num) {
                const fullUrl = baseUrl + num + "/";
                const itemDiv = document.createElement('div');
                itemDiv.className = "problem-item";

                const indexSpan = document.createElement('span');
                indexSpan.className = "problem-index";
                indexSpan.innerText = (index + 1) + ".";

                const link = document.createElement('a');
                link.href = fullUrl;
                link.target = "_blank";
                link.className = "problem-link";
                link.innerText = "문제 " + num + "번 이동";

                link.onclick = function() {
                    this.classList.add('active');
                };

                itemDiv.appendChild(indexSpan);
                itemDiv.appendChild(link);
                linkListDiv.appendChild(itemDiv);
            }
        });
    }

    function copyCurrentUrl() {
        if (!window.location.search) {
            alert("먼저 '목록 생성' 버튼을 눌러 URL을 생성해주세요.");
            return;
        }
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert("공유 가능한 URL이 복사되었습니다!");
        });
    }
</script>

</body>
</html>
