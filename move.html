<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>바둑 플레이어 - 모바일 최적화</title>
    <style>
        body { 
            background: #000; color: white; margin: 0; font-family: sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; overflow: hidden;
            /* 터치 시 불필요한 확대 방지 및 반응속도 향상 */
            touch-action: manipulation;
        }
        #main-container { display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box; padding: 10px; }
        
        #game-box { 
            position: relative; width: 95vw; height: 95vw; max-width: 600px; max-height: 600px;
            background: #e3a857; border: 2px solid #5d4037; box-shadow: 0 5px 15px rgba(0,0,0,0.5); flex-shrink: 0; 
        }
        svg { width: 100%; height: 100%; touch-action: none; }
        
        #side-panel { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 10px; gap: 10px; }
        
        #info { 
            height: 80px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: #1a1a1a; border: 2px solid #333; border-radius: 12px; position: relative; cursor: pointer;
        }
        .info-label { font-size: 0.9em; color: #888; font-weight: bold; }
        #step-num { font-size: 2em; font-weight: 900; color: #ffeb3b; line-height: 1; font-family: 'Arial Black', sans-serif; }
        #mode-text { position: absolute; top: 5px; left: 10px; font-size: 0.8em; color: #ff5252; font-weight: bold; }

        /* 버튼 컨트롤 영역: 기본 모바일 세로 모드 (4개 가로 배치) */
        .controls { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            width: 100%; 
        }
        
        button { 
            height: 60px; /* 모바일 터치에 적합한 높이 */
            border: none; border-radius: 10px; 
            background: #333; color: white; 
            font-size: 16px; font-weight: bold; 
            box-shadow: 0 4px 0 #111; cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* 터치 시 하이라이트 제거 */
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #111; background: #444; }
        #reset-btn { background: #600 !important; font-size: 14px; }

        /* 가로 화면 또는 태블릿/PC (기존 레이아웃 유지 및 최적화) */
        @media (min-width: 768px) and (orientation: landscape) {
            #main-container { flex-direction: row; justify-content: center; padding: 0 20px; gap: 20px; }
            #game-box { width: 85vh; height: 85vh; }
            #side-panel { width: 280px; margin-top: 0; }
            .controls { grid-template-columns: repeat(2, 1fr); } /* 가로 모드에선 2x2 배치 */
            button { height: 70px; font-size: 18px; }
            #info { height: 120px; }
        }

        /* 아주 작은 폰 대응 */
        @media (max-width: 350px) {
            button { font-size: 12px; height: 50px; }
            #step-num { font-size: 1.5em; }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="game-box">
            <svg id="baduk-svg" viewBox="0 0 600 600">
                <rect width="600" height="600" fill="#e3a857"/>
                <g id="grid-lines"></g>
                <g id="star-points"></g>
                <g id="stones-layer"></g>
            </svg>
        </div>

        <div id="side-panel">
            <div id="info" onclick="jumpToMove()">
                <span id="mode-text"></span>
                <span class="info-label">수순</span>
                <span id="step-num">0</span>
            </div>
            <div class="controls">
                <button onclick="prev()">이전</button>
                <button id="play-btn" onclick="togglePlay()">정지</button>
                <button onclick="next()">다음</button>
                <button id="reset-btn" onclick="resetToKibo()">복원</button>
            </div>
        </div>
    </div>

    <script>
        // ... (이하 JavaScript 로직은 사용자가 제공한 코드와 동일하게 유지됩니다) ...
        const pdfTable = [[211,221,231,241,251,261,271,281,291,101,191,181,171,161,151,141,131,121,111],[212,222,232,242,252,262,272,282,292,102,192,182,172,162,152,142,132,122,112],[213,223,233,243,253,263,273,283,293,103,193,183,173,163,153,143,133,123,113],[214,224,234,244,254,264,274,284,294,104,194,184,174,164,154,144,134,124,114],[215,225,235,245,255,265,275,285,295,105,195,185,175,165,155,145,135,125,115],[216,226,236,246,256,266,276,286,296,106,196,186,176,166,156,146,136,126,116],[217,227,237,247,257,267,277,287,297,107,197,187,177,167,157,147,137,127,117],[218,228,238,248,258,268,278,288,298,108,198,188,178,168,158,148,138,128,118],[219,229,239,249,259,269,279,289,299,109,199,189,179,169,159,149,139,129,119],[310,320,330,340,350,360,370,380,390,100,190,180,170,160,150,140,130,120,110],[319,329,339,349,359,369,379,389,399,309,499,489,479,469,459,449,439,429,419],[318,328,338,348,358,368,378,388,398,308,498,488,478,468,458,448,438,428,418],[317,327,337,347,357,367,377,387,397,307,497,487,477,467,457,447,437,427,417],[316,326,336,346,356,366,376,386,396,306,496,486,476,466,456,446,436,426,416],[315,325,335,345,355,365,375,385,395,305,495,485,475,465,455,445,435,425,415],[314,324,334,344,354,364,374,384,394,304,494,484,474,464,454,444,434,424,414],[313,323,333,343,353,363,373,383,393,303,493,483,473,463,453,443,433,423,413],[312,322,332,342,352,362,372,382,392,302,492,482,472,462,452,442,432,422,412],[311,321,331,341,351,361,371,381,391,301,491,481,471,461,451,441,431,421,411]];
        const numToPos = {}; pdfTable.forEach((row, r) => row.forEach((val, c) => numToPos[val] = {r, c}));
        
        let history = [[]], currentIdx = 0, isPlaying = true, interval;
        let exploreBoard = null, exploreCount = 0, lastExploreColor = 'W';
        const urlParams = new URLSearchParams(window.location.search), dataFile = urlParams.get('file');

        async function loadFile() {
            if(!dataFile) return;
            try {
                const resp = await fetch(dataFile);
                const text = await resp.text();
                if (text.includes(';W[') || text.includes(';B[')) parseSGF(text);
                else parseTextCoords(text);
            } catch (e) { console.error(e); }
        }

        function parseTextCoords(text) {
            const matches = text.match(/\d{3}/g);
            if(!matches) return;
            const moves = matches.map(m => {
                let n = parseInt(m);
                if([200,300,400].includes(n)) n = 100;
                else if(n>=201 && n<=209) n -= 100;
                else if(n>=401 && n<=409) n -= 100;
                else if(n>=210 && n<300 && n%10===0) n += 100;
                else if(n>=410 && n<500 && n%10===0) n -= 300;
                return numToPos[n] ? {r: numToPos[n].r, c: numToPos[n].c} : null;
            }).filter(m => m);
            buildHistory(moves);
        }

        function parseSGF(sgf) {
            const moveRegex = /([BW])\[([a-s]{2})\]/g;
            let moves = [], match;
            while ((match = moveRegex.exec(sgf))) {
                moves.push({ c: match[2].charCodeAt(0)-97, r: match[2].charCodeAt(1)-97 });
            }
            buildHistory(moves);
        }

        function buildHistory(moves) {
            let b = Array.from({length:19}, () => Array(19).fill(null));
            moves.forEach((m, i) => {
                const col = (i%2===0)?'B':'W';
                b[m.r][m.c] = col;
                checkCapture(m.r, m.c, col, b);
                let snap = [];
                for(let r=0; r<19; r++) for(let c=0; c<19; c++) if(b[r][c]) snap.push({r,c,color:b[r][c]});
                history.push(snap);
            });
            render();
        }

        function checkCapture(r, c, col, board) {
            const opp = col === 'B' ? 'W' : 'B';
            [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc]) => {
                if(nr>=0 && nr<19 && nc>=0 && nc<19 && (board[nr][nc]?.color || board[nr][nc]) === opp) {
                    const g = getGroup(nr, nc, board);
                    if(g.libs === 0) g.group.forEach(([gr,gc]) => board[gr][gc] = null);
                }
            });
            const self = getGroup(r, c, board);
            if(self.libs === 0) self.group.forEach(([gr,gc]) => board[gr][gc] = null);
        }

        function getGroup(r, c, board) {
            const node = board[r][c];
            const col = node?.color || node;
            const visited = new Set([`${r},${c}`]);
            const stack = [[r,c]], group = [[r,c]], libs = new Set();
            while(stack.length > 0) {
                const [currR, currC] = stack.pop();
                [[currR-1,currC],[currR+1,currC],[currR,currC-1],[currR,currC+1]].forEach(([nr,nc]) => {
                    if(nr>=0 && nr<19 && nc>=0 && nc<19) {
                        const neighbor = board[nr][nc];
                        const nCol = neighbor?.color || neighbor;
                        if(!nCol) libs.add(`${nr},${nc}`);
                        else if(nCol === col && !visited.has(`${nr},${nc}`)) {
                            visited.add(`${nr},${nc}`); stack.push([nr,nc]); group.push([nr,nc]);
                        }
                    }
                });
            }
            return {libs: libs.size, group};
        }

        function render() {
            let stones = [];
            if (exploreBoard) {
                for(let r=0; r<19; r++) for(let c=0; c<19; c++) if(exploreBoard[r][c]) stones.push({r, c, ...exploreBoard[r][c]});
            } else {
                stones = history[currentIdx] || [];
            }
            let html = '';
            stones.forEach(s => {
                const cx = 30 + s.c*30, cy = 30 + s.r*30;
                const isBlack = s.color === 'B';
                if(isBlack) html += `<circle cx="${cx}" cy="${cy}" r="14" fill="#111"/><circle cx="${cx-3}" cy="${cy-3}" r="4" fill="#555" opacity="0.4"/>`;
                else html += `<circle cx="${cx}" cy="${cy}" r="14" fill="#fff" stroke="#ccc"/><circle cx="${cx-3}" cy="${cy-3}" r="4" fill="#eee" opacity="0.8"/>`;
                if (exploreBoard && s.num) {
                    const textColor = isBlack ? "white" : "black";
                    html += `<text x="${cx}" y="${cy}" fill="${textColor}" font-size="12" font-weight="bold" text-anchor="middle" dominant-baseline="central">${s.num}</text>`;
                }
            });
            document.getElementById('stones-layer').innerHTML = html;
            document.getElementById('step-num').innerText = exploreBoard ? exploreCount : currentIdx;
            document.getElementById('mode-text').innerText = exploreBoard ? "복기 모드" : "";
        }

        document.getElementById('game-box').addEventListener('click', function(e) {
            pause();
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (600/rect.width);
            const y = (e.clientY - rect.top) * (600/rect.height);
            const c = Math.round((x - 30) / 30);
            const r = Math.round((y - 30) / 30);
            if(r>=0 && r<19 && c>=0 && c<19) {
                if(!exploreBoard) {
                    exploreBoard = Array.from({length:19}, () => Array(19).fill(null));
                    (history[currentIdx] || []).forEach(s => { exploreBoard[s.r][s.c] = { color: s.color, num: null }; });
                    lastExploreColor = (currentIdx % 2 === 0) ? 'W' : 'B';
                    exploreCount = 0;
                }
                if(!exploreBoard[r][c]) {
                    exploreCount++;
                    const nextCol = lastExploreColor === 'W' ? 'B' : 'W';
                    exploreBoard[r][c] = { color: nextCol, num: exploreCount };
                    checkCapture(r, c, nextCol, exploreBoard);
                    lastExploreColor = nextCol;
                    render();
                }
            }
        });

        function resetToKibo() { exploreBoard = null; exploreCount = 0; render(); }
        function next() { pause(); resetToKibo(); currentIdx = Math.min(currentIdx+1, history.length-1); render(); }
        function prev() { pause(); resetToKibo(); currentIdx = Math.max(currentIdx-1, 0); render(); }
        function pause() { clearInterval(interval); isPlaying=false; document.getElementById('play-btn').innerText='재생'; }
        function togglePlay() {
            if(isPlaying) pause();
            else {
                resetToKibo(); isPlaying = true; document.getElementById('play-btn').innerText='정지';
                interval = setInterval(() => { if(currentIdx < history.length-1){currentIdx++; render();} else pause(); }, 800);
            }
        }
        function jumpToMove() {
            if (isPlaying) return;
            const input = prompt(`이동할 수순 번호:`, currentIdx);
            if (input !== null) {
                const target = parseInt(input);
                if (!isNaN(target) && target >= 0 && target <= history.length-1) {
                    resetToKibo(); currentIdx = target; render();
                }
            }
        }
        document.addEventListener('keydown', (e) => { if(e.key==="ArrowLeft") prev(); else if(e.key==="ArrowRight") next(); });

        const grid = document.getElementById('grid-lines');
        for(let i=0; i<19; i++) {
            let p = 30+i*30;
            grid.innerHTML += `<line x1="${p}" y1="30" x2="${p}" y2="570" stroke="#333"/><line x1="30" y1="${p}" x2="570" y2="${p}" stroke="#333"/>`;
        }
        [3,9,15].forEach(r=>[3,9,15].forEach(c=>document.getElementById('star-points').innerHTML+=`<circle cx="${30+c*30}" cy="${30+r*30}" r="4" fill="#333"/>`));
        loadFile();
        interval = setInterval(() => { if(currentIdx < history.length-1) { currentIdx++; render(); } else pause(); }, 800);
    </script>
</body>
</html>
