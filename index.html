<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바둑 복기 프로그램</title>
    <link rel="stylesheet" type="text/css" href="https://yewang.github.io/besogo/besogo.css">
    <script type="text/javascript" src="https://yewang.github.io/besogo/besogo.all.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #eee; }
        #board-wrapper { width: 100%; max-width: 800px; height: 650px; background: white; padding: 10px; border-radius: 10px; }
        .status-panel { margin-bottom: 10px; color: #333; }
    </style>
</head>
<body>

    <div class="status-panel">
        <h3 id="msg">기보를 불러오는 중...</h3>
    </div>

    <div id="board-wrapper">
        <div id="besogo-container"></div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');
            const msgElement = document.getElementById('msg');

            if (!fileName) {
                msgElement.innerText = "파일 이름이 없습니다. 주소 뒤에 ?file=파일명.sgf를 붙여주세요.";
                return;
            }

            // 파일을 fetch로 먼저 확인
            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error('파일을 찾을 수 없습니다.');
                    return response.text();
                })
                .then(sgfData => {
                    msgElement.innerText = "복기 중: " + fileName;
                    // 파일 읽기 성공 시 바둑판 생성
                    besogo.create(document.getElementById('besogo-container'), {
                        sgf: sgfData, // 파일 경로 대신 읽어온 텍스트 데이터 전달
                        includeControls: true,
                        editor: true,
                        realBoard: true
                    });
                })
                .catch(error => {
                    msgElement.innerText = "에러: " + error.message + " (" + fileName + ")";
                    msgElement.style.color = "red";
                });
        };
    </script>
</body>
</html>
