<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바둑 복기 프로그램</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/yewang/besogo@gh-pages/besogo.css">
    <script src="https://cdn.jsdelivr.net/gh/yewang/besogo@gh-pages/besogo.all.js"></script>

    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #eee; }
        #board-wrapper { width: 100%; max-width: 800px; height: 600px; background: white; padding: 10px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status-panel { margin-bottom: 10px; text-align: center; }
        #msg { color: #333; font-weight: bold; }
    </style>
</head>
<body>

    <div class="status-panel">
        <div id="msg">라이브러리 로딩 확인 중...</div>
    </div>

    <div id="board-wrapper">
        <div id="besogo-container"></div>
    </div>

    <script>
        function initViewer() {
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');
            const msgElement = document.getElementById('msg');

            // 1. besogo가 로드되었는지 체크
            if (typeof besogo === 'undefined') {
                msgElement.innerText = "라이브러리를 불러오지 못했습니다. 새로고침(F5)을 해주세요.";
                msgElement.style.color = "red";
                return;
            }

            if (!fileName) {
                msgElement.innerText = "파일이 지정되지 않았습니다. (예: ?file=heaven.sgf)";
                return;
            }

            // 2. SGF 파일 불러오기
            fetch(fileName)
                .then(res => {
                    if (!res.ok) throw new Error('SGF 파일을 찾을 수 없습니다.');
                    return res.text();
                })
                .then(data => {
                    msgElement.innerText = "복기 중: " + fileName;
                    besogo.create(document.getElementById('besogo-container'), {
                        sgf: data,
                        includeControls: true,
                        editor: true,
                        realBoard: true
                    });
                })
                .catch(err => {
                    msgElement.innerText = "에러: " + err.message;
                    msgElement.style.color = "orange";
                });
        }

        // 페이지 로드 시 1초 정도 여유를 두고 실행
        window.onload = function() {
            setTimeout(initViewer, 500);
        };
    </script>
</body>
</html>
