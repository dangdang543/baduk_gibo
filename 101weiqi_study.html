<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>101weiqi 문제 리스트 생성기</title>
    <style>
        :root {
            --primary-blue: #3498db;
            --light-blue: #e3f2fd;
            --accent-blue: #00bcd4;
            --bg-color: #f0f8ff;
        }

        body { 
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; 
            padding: 15px; 
            background-color: var(--bg-color); 
            margin: 0;
            color: #2c3e50;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.15); 
        }

        h2 { 
            color: var(--primary-blue); 
            text-align: center; 
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        textarea { 
            width: 100%; 
            height: 150px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 2px solid var(--light-blue); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px; /* 모바일 입력 시 줌 방지 */
            resize: none; 
            line-height: 1.5;
            outline-color: var(--primary-blue);
        }

        .btn-group { 
            display: flex; 
            flex-direction: column; /* 모바일에서 버튼을 세로로 배치하여 터치 영역 확보 */
            gap: 10px; 
        }

        button { 
            width: 100%;
            padding: 18px; /* 버튼 크기 확대 */
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            transition: 0.3s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-main { 
            background-color: var(--primary-blue); 
            color: white; 
        }

        .btn-main:active { 
            background-color: #2980b9; 
            transform: scale(0.98);
        }

        .btn-copy { 
            background-color: var(--accent-blue); 
            color: white; 
        }

        .btn-copy:active { 
            background-color: #0097a7; 
            transform: scale(0.98);
        }
        
        #linkList { margin-top: 30px; }

        .problem-item { 
            display: flex; 
            align-items: center; 
            margin-bottom: 12px; 
            animation: fadeIn 0.4s ease; 
        }

        .problem-index { 
            width: 40px; 
            font-weight: bold; 
            color: var(--primary-blue); 
            font-size: 16px; 
        }

        .problem-link { 
            flex-grow: 1; 
            padding: 18px; /* 링크 버튼 크기 확대 */
            background: #fff; 
            color: var(--primary-blue); 
            text-decoration: none; 
            border: 2px solid var(--light-blue); 
            border-radius: 12px; 
            text-align: center; 
            transition: all 0.2s ease; 
            font-weight: 600; 
            font-size: 16px;
        }

        /* 방문한 링크 또는 클릭한 링크 상태 */
        .problem-link.active {
            background-color: #f8f9fa;
            color: #bdc3c7;
            border-color: #eee;
            text-decoration: line-through;
        }
        
        .hint { 
            font-size: 14px; 
            color: #7f8c8d; 
            margin-top: 25px; 
            text-align: center; 
            line-height: 1.6; 
            word-break: keep-all;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* 데스크탑 환경에서 버튼 가로 배치 */
        @media (min-width: 480px) {
            .btn-group { flex-direction: row; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🧩 101weiqi 오답노트</h2>
    <textarea id="nums" placeholder="문제 번호들을 입력하세요&#10;(예: 45788 32104 2293)"></textarea>
    
    <div class="btn-group">
        <button class="btn-main" onclick="generateAndGo()">무작위 섞기 & 생성</button>
        <button class="btn-copy" onclick="copyCurrentUrl()">URL 복사</button>
    </div>
    <p class="hint">번호 입력 후 생성 버튼을 누르세요.<br>목록 생성 후 'URL 복사'를 하면 나중에 다시 볼 수 있습니다.</p>
    
    <div id="linkList"></div>
</div>

<script>
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const numsParam = urlParams.get('nums');
        if (numsParam) {
            document.getElementById('nums').value = numsParam.split(',').join(' ');
            processProblems(numsParam);
        }
    };

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateAndGo() {
        const inputVal = document.getElementById('nums').value.trim();
        if (!inputVal) {
            alert("입력된 번호가 없습니다.");
            return;
        }

        let numbersArray = inputVal.split(/[\s,]+/).filter(n => n.length > 0);
        numbersArray = shuffleArray(numbersArray);
        const formattedNums = numbersArray.join(',');
        
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?nums=' + formattedNums;
        window.history.pushState({ path: newUrl }, '', newUrl);

        processProblems(formattedNums);
    }

    function processProblems(numbersString) {
        const linkListDiv = document.getElementById('linkList');
        const baseUrl = "https://www.101weiqi.com/q/";
        const numbers = numbersString.split(',');

        linkListDiv.innerHTML = ""; 

        numbers.forEach((num, index) => {
            if (num) {
                const fullUrl = baseUrl + num + "/";
                const itemDiv = document.createElement('div');
                itemDiv.className = "problem-item";

                const indexSpan = document.createElement('span');
                indexSpan.className = "problem-index";
                indexSpan.innerText = (index + 1) + ".";

                const link = document.createElement('a');
                link.href = fullUrl;
                link.target = "_blank";
                link.className = "problem-link";
                link.innerText = "문제 " + num + "번 열기";

                link.onclick = function() {
                    this.classList.add('active');
                };

                itemDiv.appendChild(indexSpan);
                itemDiv.appendChild(link);
                linkListDiv.appendChild(itemDiv);
            }
        });
        
        // 생성 후 목록으로 자동 스크롤
        linkListDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function copyCurrentUrl() {
        if (!window.location.search) {
            alert("먼저 목록을 생성해 주세요.");
            return;
        }
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert("주소가 복사되었습니다!");
        });
    }
</script>

</body>
</html>
