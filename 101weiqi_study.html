<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>101weiqi 범용 오답노트 생성기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 30px; background-color: #f4f7f6; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        
        .input-section { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #555; margin-bottom: 5px; }
        
        input[type="text"], textarea { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; 
            box-sizing: border-box; font-size: 15px; transition: border 0.3s;
        }
        input[type="text"]:focus, textarea:focus { border-color: #007bff; outline: none; }
        
        textarea { height: 100px; resize: vertical; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; transition: 0.2s; }
        .btn-main { background-color: #007bff; color: white; }
        .btn-main:hover { background-color: #0056b3; }
        .btn-copy { background-color: #28a745; color: white; }
        .btn-copy:hover { background-color: #218838; }
        
        #linkList { margin-top: 25px; border-top: 2px solid #eee; padding-top: 20px; }
        .problem-item { display: flex; align-items: center; margin-bottom: 10px; animation: fadeIn 0.4s ease forwards; }
        .problem-index { width: 40px; font-weight: bold; color: #888; }
        .problem-link { 
            flex-grow: 1; padding: 12px; background: #fff; color: #007bff; 
            text-decoration: none; border: 1px solid #007bff; border-radius: 6px; 
            text-align: center; transition: all 0.2s; 
        }
        .problem-link:hover { background: #007bff; color: #fff; }
        .problem-link.active {
            background-color: #f8f9fa;
            color: #ccc;
            border-color: #ddd;
            text-decoration: line-through;
        }
        
        .hint { font-size: 13px; color: #7f8c8d; margin-top: 15px; text-align: center; line-height: 1.6; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h2>101weiqi 오답노트 생성기</h2>
    
    <div class="input-section">
        <label for="bookId">📖 책 번호 (Book ID)</label>
        <input type="text" id="bookId" placeholder="예: 469 (수근대사전)" value="469">
    </div>

    <div class="input-section">
        <label for="nums">🧩 문제 번호 목록</label>
        <textarea id="nums" placeholder="예: 10 25 103 (스페이스나 콤마로 구분)"></textarea>
    </div>
    
    <div class="btn-group">
        <button class="btn-main" onclick="generateAndGo()">무작위 목록 생성</button>
        <button class="btn-copy" onclick="copyCurrentUrl()">공유 URL 복사</button>
    </div>
    
    <p class="hint">책 번호와 문제 번호를 입력하면 무작위 순서로 나열됩니다.<br>링크를 클릭하면 완료 표시(취소선)가 남습니다.</p>
    
    <div id="linkList"></div>
</div>

<script>
    // 초기 로드 시 URL 파라미터 확인
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const bidParam = urlParams.get('bid');
        const numsParam = urlParams.get('nums');
        
        if (bidParam) document.getElementById('bookId').value = bidParam;
        if (numsParam) {
            document.getElementById('nums').value = numsParam.split(',').join(' ');
            processProblems(bidParam, numsParam);
        }
    };

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateAndGo() {
        const bookId = document.getElementById('bookId').value.trim();
        const inputVal = document.getElementById('nums').value.trim();

        if (!bookId) {
            alert("책 번호를 입력해 주세요.");
            return;
        }
        if (!inputVal) {
            alert("문제 번호를 입력해 주세요.");
            return;
        }

        let numbersArray = inputVal.split(/[\s,]+/).filter(n => n.length > 0);
        numbersArray = shuffleArray(numbersArray);
        const formattedNums = numbersArray.join(',');
        
        // 브라우저 주소창 업데이트 (bid와 nums 모두 포함)
        const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + 
                       '?bid=' + bookId + '&nums=' + formattedNums;
        window.history.pushState({ path: newUrl }, '', newUrl);

        processProblems(bookId, formattedNums);
    }

    function processProblems(bookId, numbersString) {
        const linkListDiv = document.getElementById('linkList');
        const baseUrl = `https://www.101weiqi.com/book/levelorder/${bookId}/`;
        const numbers = numbersString.split(',');

        linkListDiv.innerHTML = ""; 

        numbers.forEach((num, index) => {
            if (num) {
                const fullUrl = baseUrl + num + "/";
                const itemDiv = document.createElement('div');
                itemDiv.className = "problem-item";

                const indexSpan = document.createElement('span');
                indexSpan.className = "problem-index";
                indexSpan.innerText = (index + 1) + ".";

                const link = document.createElement('a');
                link.href = fullUrl;
                link.target = "_blank";
                link.className = "problem-link";
                link.innerText = `[책 ${bookId}] ${num}번 문제 학습하기`;

                link.onclick = function() {
                    this.classList.add('active');
                };

                itemDiv.appendChild(indexSpan);
                itemDiv.appendChild(link);
                linkListDiv.appendChild(itemDiv);
            }
        });
    }

    function copyCurrentUrl() {
        if (!window.location.search) {
            alert("먼저 '목록 생성' 버튼을 눌러 URL을 생성해주세요.");
            return;
        }
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert("설정된 책과 문제 목록이 포함된 URL이 복사되었습니다!");
        });
    }
</script>

</body>
</html>
